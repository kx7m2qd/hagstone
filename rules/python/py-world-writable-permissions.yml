rules:
  - id: py-world-writable-permissions
    languages: [python]
    severity: WARNING
    message: >-
      A file or directory is made writable by every user on the machine (mode with the "others
      write" bit, e.g. `0o777` / `0o666`, or `umask(0)`). Any local user or compromised service can
      then change it, which turns into code execution if it holds code, config or uploads that get
      served. Use the narrowest mode that works (`0o600` / `0o640` for files, `0o700` / `0o750` for
      directories).
    metadata:
      title: World-writable file permissions
      cwe: ["CWE-732: Incorrect Permission Assignment for Critical Resource"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: high
      severity: medium
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: os.chmod($P, $MODE, ...)
              - pattern: os.fchmod($FD, $MODE)
              - pattern: os.lchmod($P, $MODE)
              - pattern: os.makedirs($P, $MODE, ...)
              - pattern: os.makedirs($P, ..., mode=$MODE, ...)
              - pattern: os.mkdir($P, $MODE, ...)
              - pattern: os.mkdir($P, ..., mode=$MODE, ...)
              - pattern: os.open($P, $FLAGS, $MODE, ...)
              - pattern: $PATH.chmod($MODE)
              - pattern: $PATH.mkdir(..., mode=$MODE, ...)
              - pattern: $PATH.touch(..., mode=$MODE, ...)
          - metavariable-comparison:
              metavariable: $MODE
              comparison: $MODE & 2 == 2
      - pattern: os.umask(0)
      - pattern: os.chmod($P, <... stat.S_IWOTH ...>, ...)
      - pattern: os.chmod($P, <... stat.S_IRWXO ...>, ...)
