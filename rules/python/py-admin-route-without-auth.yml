rules:
  - id: py-admin-route-without-auth
    languages: [python]
    severity: ERROR
    message: >-
      An admin or internal endpoint has no authentication: a Flask route with no login decorator
      and no user check, or a DRF view that writes data with `permission_classes = [AllowAny]`.
      Anyone who finds the URL can use it. Add `@login_required` plus a role check (Flask), or
      `IsAdminUser` / `IsAuthenticated` with object permissions (DRF).
    metadata:
      title: Admin endpoint without authentication
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: medium
      severity: high
    pattern-either:
      - patterns:
          - pattern: |
              @$APP.$ROUTE("$PATH", ...)
              def $F(...):
                ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete)$
          - metavariable-regex:
              metavariable: $PATH
              regex: ^/(api/)?(v\d+/)?(admin|administration|internal|manage|management|debug|ops|superuser)(/|$)
          - pattern-not-regex: (?i)(login_required|requires?_auth|auth_required|authenticat|admin_required|roles?_(required|accepted)|permission|current_user|session\.get|session\[|jwt_required|verify_jwt|is_admin|is_staff|is_superuser|api_key|token_required)
      - patterns:
          - pattern-inside: |
              class $C(..., $BASE, ...):
                ...
          - metavariable-regex:
              metavariable: $BASE
              regex: ^(viewsets\.)?(ModelViewSet|(generics\.)?(ListCreate|RetrieveUpdate|RetrieveUpdateDestroy|Create|Update|Destroy)APIView)$
          - pattern-either:
              - pattern: permission_classes = [AllowAny]
              - pattern: permission_classes = (AllowAny,)
              - pattern: permission_classes = [permissions.AllowAny]
              - pattern: permission_classes = (permissions.AllowAny,)
