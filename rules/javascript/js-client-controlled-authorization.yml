rules:
  - id: js-client-controlled-authorization
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An access decision is made from a value the client sends (a `role` / `isAdmin` query
      parameter, body field, header or cookie). Anyone can send `role=admin` and get admin access.
      Authorization must come from server-side state: the role stored for the logged-in user
      (session, database, verified token claims), never from a parameter, header or cookie the
      client can set to anything.
    metadata:
      title: Authorization based on client-controlled data
      cwe: ["CWE-863: Incorrect Authorization", "CWE-807: Reliance on Untrusted Inputs in a Security Decision"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: high
      severity: high
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.$SRC.$KEY
              - pattern: $REQ.$SRC[$KEY]
          - metavariable-regex:
              metavariable: $SRC
              regex: ^(query|body|params|headers|cookies|signedCookies)$
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^[\"']?(x-)?(user[-_]?)?(roles?|is[-_]?admin|admin|is[-_]?staff|is[-_]?superuser|superuser|privileges?|permissions?|access[-_]?level|user[-_]?type|account[-_]?type|group)[\"']?$
      - patterns:
          - pattern-either:
              - pattern: $REQ.get($KEY)
              - pattern: $REQ.header($KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^[\"']?(x-)?(user[-_]?)?(roles?|is[-_]?admin|admin|is[-_]?staff|is[-_]?superuser|superuser|privileges?|permissions?|access[-_]?level|user[-_]?type|account[-_]?type|group)[\"']?$
    pattern-sinks:
      # Compared with a privileged value, or used as a yes/no in a condition.
      - patterns:
          - pattern-either:
              - pattern: $T == "$LIT"
              - pattern: $T === "$LIT"
              - pattern: '"$LIT" == $T'
              - pattern: '"$LIT" === $T'
              - pattern: $T != "$LIT"
              - pattern: $T !== "$LIT"
          - metavariable-regex:
              metavariable: $LIT
              regex: (?i)^(admin|administrator|root|superuser|super[-_]?admin|staff|manager|owner|true|1|yes)$
          - focus-metavariable: $T
      - patterns:
          - pattern-either:
              - pattern: $T === true
              - pattern: $T == true
              - patterns:
                  - pattern-inside: if ($T) $S
                  - pattern: $T
              - patterns:
                  - pattern-inside: if (!$T) $S
                  - pattern: $T
          - focus-metavariable: $T
