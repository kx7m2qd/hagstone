rules:
  - id: java-admin-route-without-auth
    languages: [java]
    severity: ERROR
    message: >-
      Spring Security lets anyone reach admin, management or actuator endpoints (`permitAll()` or
      `web.ignoring()` on those paths, or `anyRequest().permitAll()`). Anyone who finds the URL can
      use them; actuator endpoints such as `/env` and `/heapdump` leak secrets. Require
      authentication and an admin role (`.requestMatchers("/admin/**").hasRole("ADMIN")`), and expose
      only `health`/`info` without login.
    metadata:
      title: Admin endpoints open without authentication
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: high
      severity: high
    pattern-either:
      - pattern: $X.anyRequest().permitAll()
      - patterns:
          - pattern-either:
              - pattern: $X.$MATCH(..., "$PATH", ...).permitAll()
              - pattern: $W.ignoring().$MATCH(..., "$PATH", ...)
          - metavariable-regex:
              metavariable: $MATCH
              regex: ^(requestMatchers|antMatchers|mvcMatchers|regexMatchers)$
          - metavariable-regex:
              metavariable: $PATH
              regex: ^\^?/(api/)?(admin|administration|internal|manage|management|ops|actuator(/(\*\*?|env|heapdump|shutdown|beans|configprops|loggers|threaddump|jolokia|mappings|gateway).*)?$|console|h2-console)
