rules:
  - id: java-unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      Request data is deserialized with `ObjectInputStream` or `XMLDecoder`. These formats can name
      any class on the classpath, and known gadget chains turn that into remote code execution.
      Accept plain data (JSON into a fixed class) instead. If you must use Java serialization, call
      `setObjectInputFilter` with a filter that allows only your own classes before `readObject`.
      `XMLDecoder` can't be made safe for untrusted input.
    metadata:
      title: Unsafe deserialization
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: high
      severity: critical
    mode: taint
    pattern-sources:
      # Servlet request data (javax and jakarta).
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
              - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
              - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getInputStream|getReader|getPathInfo|getPart|getParts)$
      # Spring MVC / JAX-RS handler parameters bound from the request (numbers, booleans and UUIDs can't carry an injection).
      # The parameter itself (its declaration), so dataflow carries it and a guard can clean it.
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., @$ANN $T $P, ...) { ... }
              - pattern: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam|MatrixParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|Instant)$)
          - focus-metavariable: $P
    pattern-propagators:
      - pattern: (StringBuilder $SB).append($X)
        from: $X
        to: $SB
      - pattern: (StringBuffer $SB).append($X)
        from: $X
        to: $SB
    pattern-sanitizers:
      # An ObjectInputFilter on the stream limits which classes it may create.
      - by-side-effect: true
        patterns:
          - pattern-inside: |
              $OIS.setObjectInputFilter(...);
              ...
          - pattern: $OIS
    pattern-sinks:
      # Reading from a stream built on request data (a filter set on it first makes it safe, above).
      - patterns:
          - pattern-either:
              - pattern: (ObjectInputStream $OIS).$READ(...)
              - pattern: (java.io.ObjectInputStream $OIS).$READ(...)
          - metavariable-regex:
              metavariable: $READ
              regex: ^(readObject|readUnshared)$
          - focus-metavariable: $OIS
      - patterns:
          - pattern-either:
              - pattern: new ObjectInputStream($IN).$READ(...)
              - pattern: new java.io.ObjectInputStream($IN).$READ(...)
          - metavariable-regex:
              metavariable: $READ
              regex: ^(readObject|readUnshared)$
          - focus-metavariable: $IN
      - patterns:
          - pattern-either:
              - pattern: new XMLDecoder($IN, ...)
              - pattern: new java.beans.XMLDecoder($IN, ...)
          - focus-metavariable: $IN
