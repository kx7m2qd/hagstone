rules:
  - id: java-code-injection
    languages: [java]
    severity: ERROR
    message: >-
      Request data is evaluated as code: a SpEL expression, a script (`ScriptEngine`, Groovy) or an
      MVEL, OGNL or JEXL expression. An attacker can call any Java method, typically
      `T(java.lang.Runtime).getRuntime().exec(...)`, and take over the server. Never evaluate input
      as an expression; map it to a fixed set of operations. For SpEL over user data, evaluate with
      `SimpleEvaluationContext`, which has no type references or constructors.
    metadata:
      title: Code / expression language injection
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-917: Improper Neutralization of Special Elements used in an Expression Language Statement"]
      owasp: ["A03:2021 - Injection"]
      confidence: high
      severity: critical
    mode: taint
    pattern-sources:
      # Servlet request data (javax and jakarta).
      - patterns:
          - pattern-either:
              - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
              - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
              - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
              - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
          - metavariable-regex:
              metavariable: $GET
              regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getInputStream|getReader|getPathInfo|getPart|getParts)$
      # Spring MVC / JAX-RS handler parameters bound from the request (numbers, booleans and UUIDs can't carry an injection).
      # The parameter itself (its declaration), so dataflow carries it and a guard can clean it.
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., @$ANN $T $P, ...) { ... }
              - pattern: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $ANN
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable|RequestPart|QueryParam|PathParam|FormParam|HeaderParam|CookieParam|MatrixParam)$
          - metavariable-regex:
              metavariable: $T
              regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigInteger|BigDecimal|UUID|LocalDate|LocalDateTime|Instant)$)
          - focus-metavariable: $P
    pattern-propagators:
      - pattern: (StringBuilder $SB).append($X)
        from: $X
        to: $SB
      - pattern: (StringBuffer $SB).append($X)
        from: $X
        to: $SB
    pattern-sanitizers:
      - pattern-either:
          - pattern: Integer.parseInt(...)
          - pattern: Integer.valueOf(...)
          - pattern: Long.parseLong(...)
          - pattern: Long.valueOf(...)
          - pattern: Double.parseDouble(...)
          - pattern: Boolean.parseBoolean(...)
          - pattern: java.util.UUID.fromString(...)
      # Rejected unless it is in an allowlist or matches a pattern: clean from there on.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern-inside: if (!$C.contains($X)) { ... }
              - pattern-inside: if (!$C.contains($X)) $S;
              - pattern-inside: if (!$X.matches($RE)) { ... }
              - pattern-inside: if (!$X.matches($RE)) $S;
          - pattern: $X
    pattern-sinks:
      # SpEL, unless it is evaluated with SimpleEvaluationContext.
      - patterns:
          - pattern-either:
              - pattern: (ExpressionParser $P).parseExpression($X, ...)
              - pattern: (SpelExpressionParser $P).parseExpression($X, ...)
              - pattern: new SpelExpressionParser().parseExpression($X, ...)
          - pattern-not-inside: $E.getValue(<... SimpleEvaluationContext.$B(...) ...>, ...)
          - pattern-not-inside: |
              $TYPE $CTX = <... SimpleEvaluationContext.$B(...) ...>;
              ...
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: (ScriptEngine $E).eval($X, ...)
              - pattern: (javax.script.ScriptEngine $E).eval($X, ...)
              - pattern: (Compilable $E).compile($X)
              - pattern: (GroovyShell $G).evaluate($X, ...)
              - pattern: (GroovyShell $G).parse($X, ...)
              - pattern: new GroovyShell(...).evaluate($X, ...)
              - pattern: MVEL.eval($X, ...)
              - pattern: MVEL.compileExpression($X, ...)
              - pattern: Ognl.getValue($X, ...)
              - pattern: Ognl.parseExpression($X)
              - pattern: (JexlEngine $J).createExpression($X)
              - pattern: (JexlEngine $J).createScript($X, ...)
          - focus-metavariable: $X
