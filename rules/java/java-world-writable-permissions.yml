rules:
  - id: java-world-writable-permissions
    languages: [java]
    severity: WARNING
    message: >-
      A file or directory is made writable by every user on the machine (`OTHERS_WRITE`,
      `"rwxrwxrwx"`, or `setWritable(true, false)`). Any local user or compromised service can then
      change it, which turns into code execution if it holds code, config or uploads that get
      served. Use the narrowest permissions that work (`rw-------` / `rw-r-----` for files,
      `rwx------` / `rwxr-x---` for directories).
    metadata:
      title: World-writable file permissions
      cwe: ["CWE-732: Incorrect Permission Assignment for Critical Resource"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: high
      severity: medium
    pattern-either:
      - patterns:
          - pattern: PosixFilePermissions.fromString("$PERMS")
          - metavariable-regex:
              metavariable: $PERMS
              regex: ^.{7}w.$
      - pattern: PosixFilePermission.OTHERS_WRITE
      - pattern: (File $F).setWritable(true, false)
      - pattern: $F.setWritable(true, false)
